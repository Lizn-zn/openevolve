# Example configuration for MCTS with Rule-Based Partitioning
# This configuration demonstrates how to enable and configure
# rule-based space partitioning and MCTS exploration

# General settings
max_iterations: 1000
checkpoint_interval: 100
log_level: INFO

# Database configuration
database:
  population_size: 1000
  archive_size: 100
  num_islands: 5
  feature_dimensions:
    - "complexity"
    - "diversity"

# Rule-based space partitioning configuration
rule_partition:
  enabled: true
  rule_program_path: "problems/erdos_475/rule.py"  # Path to your rule program
  use_with_map_elites: false  # Set to true to use with MAP-Elites in parallel

# MCTS (Monte Carlo Tree Search) configuration
mcts:
  enabled: true
  exploration_constant: 1.414  # sqrt(2), UCB1 exploration constant
  simulations_per_iteration: 10  # Number of MCTS simulations per iteration
  reward_function: "best_fitness"  # Options: "best_fitness", "average_fitness", "max_improvement"
  use_rule_partition: true  # Must be true when rule_partition.enabled=true
  sampling_ratio: 0.7  # 70% MCTS sampling, 30% original strategy

# LLM configuration (example)
llm:
  api_base: "https://api.openai.com/v1"
  models:
    - name: "gpt-4"
      temperature: 0.7
      weight: 1.0

# Evaluator configuration
evaluator:
  timeout: 300
  max_retries: 3
  cascade_evaluation: true

